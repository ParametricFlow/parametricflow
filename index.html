<style>

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* ==========================
   Luz Principal
========================== */

body::after{

    content:"";

    position:absolute;

    inset:-40%;

    background:

    linear-gradient(
        125deg,
        transparent 0%,
        rgba(90,160,255,.08) 28%,
        rgba(120,190,255,.18) 42%,
        rgba(70,130,255,.10) 56%,
        transparent 75%
    );

    transform:rotate(-8deg);

    animation:moveLight 18s ease-in-out infinite alternate;

    filter:blur(80px);
    z-index:0;
    pointer-events:none;

}

/* ==========================
   Contenedor Central
========================== */

.center-piece{

    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    transform:translateY(-58px);
    z-index:5;
    pointer-events:none;

}

.center-piece::before{

    content:"";
    position:absolute;
    width:480px;
    height:480px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(35,150,255,.14) 0%,
        rgba(30,110,255,.08) 45%,
        transparent 75%);
    filter:blur(120px);
    z-index:-2;

}

.center-piece::after{

    content:"";
    position:absolute;
    width:720px;
    height:720px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(255,255,255,.02) 0%,
        rgba(80,140,255,.02) 40%,
        transparent 75%);
    filter:blur(220px);
    z-index:-3;

}

/* ==========================
   Imagen
========================== */

.center-piece img{

    width:min(32.5vw,480px);

    height:auto;

    object-fit:contain;

    filter:

       drop-shadow(0 0 18px rgba(0,180,255,.28))
       drop-shadow(0 0 55px rgba(0,120,255,.24))
       drop-shadow(0 30px 80px rgba(0,0,0,.55));

    animation:float 10s cubic-bezier(.45,.05,.55,.95) infinite;

}

/* ==========================
   Animaciones
========================== */

@keyframes moveLight{

    from{

        transform:
        rotate(-8deg)
        translateX(-5%)
        translateY(-2%);

    }

    to{

        transform:
        rotate(-5deg)
        translateX(5%)
        translateY(2%);

    }

}

@keyframes float{

    0%{
        transform:translate3d(0,0,0) rotate(-0.25deg);
    }

    25%{
        transform:translate3d(-3px,-6px,0) rotate(0deg);
    }

    50%{
        transform:translate3d(0,-12px,0) rotate(.25deg);
    }

    75%{
        transform:translate3d(3px,-6px,0) rotate(0deg);
    }

    100%{
        transform:translate3d(0,0,0) rotate(-0.25deg);
    }

}

/*======================================
            VALORES
======================================*/

.hero-values{

    position:absolute;
    left:50%;
    bottom:34px;
    transform:translateX(-50%);
    width:96%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:20;
    pointer-events:none;

}

.hero-values .left,
.hero-values .right{

    display:flex;
    gap:34px;

}

.hero-values span{

    color:#EAF2FF;
    font-size:11px;
    font-weight:500;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:.92;

}

/*======================================
            ESLOGAN
======================================*/

.hero-slogan{

    position:absolute;
    left:50%;
    top:calc(50% + 190px);
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    z-index:15;
    pointer-events:none;

}

.hero-slogan h1{

    color:#F4F6FA;
    font-family:'Manrope',sans-serif;
    font-size:58px;
    font-weight:700;
    line-height:1;
    letter-spacing:2px;
    text-transform:uppercase;
    white-space:nowrap;

}

.footer{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    padding:0;
    pointer-events:none;
}

@media (max-width:900px){

    .hero-slogan{
        top:calc(50% + 150px);
    }

    .hero-slogan h1{
        font-size:clamp(24px,7vw,40px);
        white-space:normal;
        padding:0 16px;
    }

    .hero-values{
        bottom:20px;
    }

    .hero-values .left,
    .hero-values .right{
        gap:16px;
    }

    .hero-values span{
        font-size:9px;
        letter-spacing:2px;
    }
}

</style>
